<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Spa Model Viewer</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				padding: 0;
				background-color: #bfd1e5;
				overflow: hidden;
			}
			#container {
				width: 100%;
				height: 100vh;
			}
			#loading {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: #333;
				font-family: Arial, sans-serif;
				font-size: 20px;
			}
		</style>
	</head>
	<body>

		<div id="container"></div>
		<div id="loading">Loading spa.glb...</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.165.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			let container, camera, controls, scene, renderer;
			let spaModel = null;

			init();

			function init() {

				container = document.getElementById('container');
				
				// Remover mensaje de carga cuando se inicie
				const loadingElement = document.getElementById('loading');
				
				renderer = new THREE.WebGLRenderer({ antialias: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setAnimationLoop(animate);
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFSoftShadowMap;
				container.appendChild(renderer.domElement);

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xbfd1e5);

				// Configurar cámara
				camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
				camera.position.set(5, 3, 5);

				// Controles de órbita
				controls = new OrbitControls(camera, renderer.domElement);
				controls.enableDamping = true;
				controls.dampingFactor = 0.05;
				controls.minDistance = 1;
				controls.maxDistance = 50;

				// Configurar iluminación
				const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
				scene.add(ambientLight);

				const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
				directionalLight.position.set(5, 10, 7);
				directionalLight.castShadow = true;
				directionalLight.shadow.mapSize.width = 2048;
				directionalLight.shadow.mapSize.height = 2048;
				directionalLight.shadow.camera.near = 0.5;
				directionalLight.shadow.camera.far = 50;
				scene.add(directionalLight);

				// Cargar el modelo spa.glb
				const loader = new GLTFLoader();
				
				loader.load(
					'spa.glb',
					
					function(gltf) {
						spaModel = gltf.scene;
						
						// Habilitar sombras para todos los objetos del modelo
						spaModel.traverse(function(child) {
							if (child.isMesh) {
								child.castShadow = true;
								child.receiveShadow = true;
							}
						});
						
						// Ajustar la posición y escala
						spaModel.position.set(0, 0, 0);
						spaModel.scale.set(1, 1, 1);
						
						scene.add(spaModel);
						
						// Calcular el bounding box para centrar la cámara
						const box = new THREE.Box3().setFromObject(spaModel);
						const center = box.getCenter(new THREE.Vector3());
						const size = box.getSize(new THREE.Vector3());
						
						// Ajustar la cámara para ver todo el modelo
						const maxDim = Math.max(size.x, size.y, size.z);
						const fov = camera.fov * (Math.PI / 180);
						let cameraZ = Math.abs(maxDim / Math.sin(fov / 2));
						
						camera.position.set(center.x, center.y, center.z + cameraZ * 1.5);
						controls.target.copy(center);
						controls.update();
						
						// Remover mensaje de carga
						if (loadingElement) {
							loadingElement.style.display = 'none';
						}
						
						console.log('✅ Modelo spa.glb cargado correctamente');
					},
					
					function(xhr) {
						// Mostrar progreso de carga
						if (loadingElement) {
							const percentage = (xhr.loaded / xhr.total * 100).toFixed(2);
							loadingElement.textContent = `Loading spa.glb... ${percentage}%`;
						}
					},
					
					function(error) {
						console.error('❌ Error al cargar el modelo spa.glb:', error);
						if (loadingElement) {
							loadingElement.textContent = 'Error loading model. Check console.';
							loadingElement.style.color = 'red';
						}
					}
				);

				// Piso simple para sombras
				const planeGeometry = new THREE.PlaneGeometry(20, 20);
				const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
				const plane = new THREE.Mesh(planeGeometry, planeMaterial);
				plane.rotation.x = -Math.PI / 2;
				plane.position.y = -0.5;
				plane.receiveShadow = true;
				scene.add(plane);

				// Manejar redimensionamiento de ventana
				window.addEventListener('resize', onWindowResize);
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function animate() {
				controls.update();
				renderer.render(scene, camera);
			}

		</script>

	</body>
</html>
