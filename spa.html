<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Spa Model Viewer</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<style>
			body {
				margin: 0;
				padding: 0;
				background-color: #bfd1e5;
				overflow: hidden;
				font-family: Arial, sans-serif;
			}
			#container {
				width: 100%;
				height: 100vh;
				cursor: grab;
			}
			#container:active {
				cursor: grabbing;
			}
			#loading {
				position: absolute;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				color: #333;
				font-size: 20px;
				background: rgba(255, 255, 255, 0.8);
				padding: 20px;
				border-radius: 10px;
				text-align: center;
			}
			#controls {
				position: absolute;
				bottom: 20px;
				left: 50%;
				transform: translateX(-50%);
				background: rgba(255, 255, 255, 0.8);
				padding: 10px 20px;
				border-radius: 10px;
				font-size: 14px;
			}
		</style>
	</head>
	<body>

		<div id="container"></div>
		<div id="loading">Loading spa.glb...</div>
		<div id="controls">
			Mouse: Rotate | Scroll: Zoom | Right click: Pan
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.165.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

			let container, camera, controls, scene, renderer;
			let spaModel = null;
			let boundingBox = null;

			init();

			function init() {

				container = document.getElementById('container');
				const loadingElement = document.getElementById('loading');
				
				// Renderer con mejores configuraciones
				renderer = new THREE.WebGLRenderer({ 
					antialias: true,
					alpha: true,
					powerPreference: "high-performance"
				});
				renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.setAnimationLoop(animate);
				renderer.shadowMap.enabled = true;
				renderer.shadowMap.type = THREE.PCFSoftShadowMap;
				renderer.outputColorSpace = THREE.SRGBColorSpace;
				container.appendChild(renderer.domElement);

				// Escena
				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xbfd1e5);

				// Cámara
				camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
				camera.position.set(10, 5, 10);

				// Controles de órbita MEJORADOS
				controls = new OrbitControls(camera, renderer.domElement);
				controls.enableDamping = true;
				controls.dampingFactor = 0.1;
				controls.rotateSpeed = 0.5;
				controls.enablePan = true;
				controls.panSpeed = 0.5;
				controls.screenSpacePanning = true;
				controls.minDistance = 0.1;
				controls.maxDistance = 500;
				controls.maxPolarAngle = Math.PI; // Permite ver desde abajo
				
				// Para mejor compatibilidad con touch
				controls.touches = {
					ONE: THREE.TOUCH.ROTATE,
					TWO: THREE.TOUCH.DOLLY_PAN
				};

				// Iluminación mejorada
				const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
				scene.add(ambientLight);

				const directionalLight1 = new THREE.DirectionalLight(0xffffff, 1.5);
				directionalLight1.position.set(10, 20, 10);
				directionalLight1.castShadow = true;
				scene.add(directionalLight1);

				const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.8);
				directionalLight2.position.set(-10, 10, -10);
				scene.add(directionalLight2);

				// Cargar el modelo con DRACOLoader si es comprimido
				const loader = new GLTFLoader();
				
				// Opcional: Configurar DRACOLoader para modelos comprimidos
				const dracoLoader = new DRACOLoader();
				dracoLoader.setDecoderPath('https://unpkg.com/three@0.165.0/examples/jsm/libs/draco/');
				loader.setDRACOLoader(dracoLoader);

				loader.load(
					'spa.glb',
					
					function(gltf) {
						spaModel = gltf.scene;
						
						console.log('Modelo cargado:', spaModel);
						
						// Opcional: Log de todos los objetos en el modelo
						spaModel.traverse(function(child) {
							if (child.isMesh) {
								console.log('Mesh encontrado:', child.name, '| Material:', child.material.name || 'sin nombre');
								child.castShadow = true;
								child.receiveShadow = true;
								
								// Mejorar la calidad del material
								if (child.material) {
									child.material.needsUpdate = true;
								}
							}
						});
						
						// Calcular bounding box para entender el tamaño
						boundingBox = new THREE.Box3().setFromObject(spaModel);
						const size = boundingBox.getSize(new THREE.Vector3());
						const center = boundingBox.getCenter(new THREE.Vector3());
						
						console.log('Tamaño del modelo:', size);
						console.log('Centro del modelo:', center);
						
						// Ajustar escala si es necesario
						const maxSize = Math.max(size.x, size.y, size.z);
						let scaleFactor = 1;
						
						if (maxSize > 20) {
							// Si el modelo es muy grande, reducirlo
							scaleFactor = 20 / maxSize;
						} else if (maxSize < 1) {
							// Si el modelo es muy pequeño, aumentarlo
							scaleFactor = 2 / maxSize;
						}
						
						spaModel.scale.setScalar(scaleFactor);
						
						// Recalcular bounding box después de escalar
						boundingBox.setFromObject(spaModel);
						boundingBox.getCenter(center);
						boundingBox.getSize(size);
						
						console.log('Tamaño después de escalar:', size);
						
						// Centrar el modelo
						spaModel.position.sub(center.multiplyScalar(scaleFactor));
						
						// Añadir al suelo (opcional, elevar un poco)
						const minY = boundingBox.min.y;
						if (minY < 0) {
							spaModel.position.y -= minY * scaleFactor;
						}
						
						scene.add(spaModel);
						
						// Ajustar cámara según el tamaño
						const newMaxSize = Math.max(size.x, size.y, size.z);
						const cameraDistance = newMaxSize * 2;
						const cameraHeight = newMaxSize * 1.5;
						
						camera.position.set(cameraDistance, cameraHeight, cameraDistance);
						controls.target.set(0, newMaxSize / 4, 0);
						controls.update();
						
						// Ajustar límites de los controles
						controls.minDistance = newMaxSize * 0.1;
						controls.maxDistance = newMaxSize * 10;
						
						// Ocultar mensaje de carga
						if (loadingElement) {
							loadingElement.style.display = 'none';
						}
						
						// Añadir ejes de referencia para debug
						const axesHelper = new THREE.AxesHelper(newMaxSize * 2);
						scene.add(axesHelper);
						
						console.log('✅ Modelo cargado y ajustado correctamente');
					},
					
					function(xhr) {
						if (loadingElement) {
							const percentage = Math.round((xhr.loaded / xhr.total) * 100);
							loadingElement.textContent = `Loading spa.glb... ${percentage}%`;
						}
					},
					
					function(error) {
						console.error('❌ Error:', error);
						if (loadingElement) {
							loadingElement.innerHTML = 'Error loading model:<br>' + error.message;
							loadingElement.style.color = 'red';
						}
						
						// Crear modelo de prueba si falla
						createTestModel();
					}
				);

				// Crear piso para referencia
				createGround();

				// Eventos de ventana
				window.addEventListener('resize', onWindowResize);
				window.addEventListener('keydown', onKeyDown);
				
				// Forzar primer render
				render();
			}

			function createGround() {
				const groundGeometry = new THREE.PlaneGeometry(100, 100);
				const groundMaterial = new THREE.MeshStandardMaterial({ 
					color: 0x888888,
					roughness: 0.8,
					metalness: 0.2
				});
				const ground = new THREE.Mesh(groundGeometry, groundMaterial);
				ground.rotation.x = -Math.PI / 2;
				ground.position.y = -0.01;
				ground.receiveShadow = true;
				scene.add(ground);
				
				// Grid helper para referencia
				const gridHelper = new THREE.GridHelper(100, 20, 0x000000, 0x000000);
				gridHelper.position.y = 0;
				scene.add(gridHelper);
			}

			function createTestModel() {
				// Modelo de prueba si el GLB falla
				const group = new THREE.Group();
				
				// Base
				const baseGeometry = new THREE.BoxGeometry(4, 0.2, 4);
				const baseMaterial = new THREE.MeshStandardMaterial({ color: 0x888888 });
				const base = new THREE.Mesh(baseGeometry, baseMaterial);
				base.position.y = 0.1;
				group.add(base);
				
				// Piscina
				const poolGeometry = new THREE.BoxGeometry(3, 0.8, 2);
				const poolMaterial = new THREE.MeshStandardMaterial({ color: 0x00aaff });
				const pool = new THREE.Mesh(poolGeometry, poolMaterial);
				pool.position.y = 0.5;
				group.add(pool);
				
				// Árboles alrededor
				for (let i = 0; i < 8; i++) {
					const angle = (i / 8) * Math.PI * 2;
					const tree = new THREE.Group();
					
					const trunkGeometry = new THREE.CylinderGeometry(0.1, 0.15, 1);
					const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
					const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
					trunk.position.y = 0.5;
					tree.add(trunk);
					
					const leavesGeometry = new THREE.ConeGeometry(0.5, 1, 8);
					const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
					const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
					leaves.position.y = 1.5;
					tree.add(leaves);
					
					const radius = 3;
					tree.position.x = Math.cos(angle) * radius;
					tree.position.z = Math.sin(angle) * radius;
					tree.position.y = 0;
					
					group.add(tree);
				}
				
				spaModel = group;
				scene.add(spaModel);
				
				// Ajustar cámara
				camera.position.set(10, 5, 10);
				controls.target.set(0, 1, 0);
				controls.update();
				
				const loadingElement = document.getElementById('loading');
				if (loadingElement) {
					loadingElement.style.display = 'none';
				}
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function onKeyDown(event) {
				// Tecla R para reset
				if (event.key === 'r' || event.key === 'R') {
					controls.reset();
				}
				// Tecla F para centrar
				if (event.key === 'f' || event.key === 'F') {
					focusOnModel();
				}
			}

			function focusOnModel() {
				if (spaModel && boundingBox) {
					const center = boundingBox.getCenter(new THREE.Vector3());
					const size = boundingBox.getSize(new THREE.Vector3());
					const maxSize = Math.max(size.x, size.y, size.z);
					const cameraDistance = maxSize * 1.5;
					
					controls.target.copy(center);
					camera.position.copy(center);
					camera.position.x += cameraDistance;
					camera.position.y += cameraDistance * 0.5;
					camera.position.z += cameraDistance;
					controls.update();
				}
			}

			function animate() {
				controls.update();
				renderer.render(scene, camera);
			}

			function render() {
				renderer.render(scene, camera);
			}

			// Forzar un render inicial
			setTimeout(render, 100);

		</script>

	</body>
</html>
