<!DOCTYPE html>
<html lang="en">
<head>
    <title>SPA Racing - Three.js Mobile Version</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        #container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            z-index: 1000;
        }
        
        /* Controles móviles */
        .control-panel {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }
        
        /* Joystick izquierdo */
        #joystickContainer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 140px;
            height: 140px;
            pointer-events: auto;
        }
        
        #joystickBase {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        #joystickHandle {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }
        
        /* Controles acelerador/freno */
        #throttleContainer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 80px;
            height: 180px;
            pointer-events: auto;
        }
        
        #brakeContainer {
            position: absolute;
            bottom: 30px;
            right: 130px;
            width: 80px;
            height: 180px;
            pointer-events: auto;
        }
        
        .pedal {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .pedal-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            border-radius: 8px;
            transition: height 0.05s;
        }
        
        #throttleFill {
            background: linear-gradient(to top, rgba(0, 255, 0, 0.3), rgba(0, 255, 0, 0.8));
        }
        
        #brakeFill {
            background: linear-gradient(to top, rgba(255, 0, 0, 0.3), rgba(255, 0, 0, 0.8));
        }
        
        .pedal-label {
            position: absolute;
            top: -25px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 12px;
            font-family: monospace;
        }
        
        /* UI Superior */
        #ui-top {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
        }
        
        .ui-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 10px;
            color: white;
            font-family: monospace;
        }
        
        #speedPanel {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }
        
        #speedValue {
            font-size: 24px;
            font-weight: bold;
            color: #0f0;
        }
        
        #gearIndicator {
            font-size: 20px;
            margin-top: 5px;
            color: #ff0;
        }
        
        #rpmPanel {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 120px;
        }
        
        #rpmBar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        #rpmFill {
            height: 100%;
            width: 0%;
            background: #0f0;
            border-radius: 5px;
            transition: width 0.1s;
        }
        
        #rpmValue {
            margin-top: 3px;
            font-size: 12px;
            color: #0f0;
        }
        
        /* Cronómetro */
        #timerPanel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 10px;
            color: white;
            font-family: monospace;
            min-width: 150px;
            text-align: center;
        }
        
        #currentTimer {
            font-size: 18px;
            color: #0f0;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        #lapCounter {
            font-size: 14px;
            color: #0ff;
        }
        
        /* Botones de control */
        .control-btn {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            pointer-events: auto;
            z-index: 20;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        #resetBtn {
            top: 80px;
            left: 10px;
        }
        
        #pauseBtn {
            top: 80px;
            right: 10px;
        }
        
        #cameraBtn {
            top: 140px;
            right: 10px;
        }
        
        /* Panel de daño */
        #damagePanel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 10px;
            padding: 10px;
            color: white;
            font-family: monospace;
            min-width: 120px;
        }
        
        #damageBar {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
        }
        
        #damageFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, #0f0, #ff0, #f00);
            border-radius: 5px;
            transition: width 0.3s;
        }
        
        /* Efectos de daño */
        .damage-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 5;
        }
        
        #redOverlay {
            background: rgba(255, 0, 0, 0.2);
        }
        
        /* Mensaje de choque */
        #crashMessage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #f00;
            padding: 20px 40px;
            border-radius: 10px;
            font-size: 24px;
            font-family: monospace;
            text-align: center;
            border: 3px solid #f00;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        
        /* Modo pantalla completa */
        #fullscreenBtn {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 10px;
            padding: 10px 15px;
            font-size: 14px;
            pointer-events: auto;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="loading">Loading SPA Circuit...</div>
    
    <!-- UI Superior -->
    <div id="ui-top">
        <div id="speedPanel" class="ui-panel">
            <div id="speedValue">0 km/h</div>
            <div id="gearIndicator">N</div>
        </div>
        
        <div id="timerPanel" class="ui-panel">
            <div id="currentTimer">00:00.000</div>
            <div id="lapCounter">Lap 0/3</div>
        </div>
        
        <div id="rpmPanel" class="ui-panel">
            <div>RPM</div>
            <div id="rpmBar">
                <div id="rpmFill"></div>
            </div>
            <div id="rpmValue">0</div>
        </div>
    </div>
    
    <!-- Panel de daño -->
    <div id="damagePanel" class="ui-panel">
        <div>DAMAGE</div>
        <div id="damageBar">
            <div id="damageFill"></div>
        </div>
    </div>
    
    <!-- Controles móviles -->
    <div id="joystickContainer" class="control-panel">
        <div id="joystickBase"></div>
        <div id="joystickHandle"></div>
    </div>
    
    <div id="throttleContainer" class="control-panel">
        <div class="pedal-label">ACCEL</div>
        <div class="pedal">
            <div id="throttleFill" class="pedal-fill"></div>
        </div>
    </div>
    
    <div id="brakeContainer" class="control-panel">
        <div class="pedal-label">BRAKE</div>
        <div class="pedal">
            <div id="brakeFill" class="pedal-fill"></div>
        </div>
    </div>
    
    <!-- Botones de control -->
    <div id="resetBtn" class="control-btn" title="Reset Position">🏁</div>
    <div id="pauseBtn" class="control-btn" title="Pause">⏸️</div>
    <div id="cameraBtn" class="control-btn" title="Change Camera">📷</div>
    
    <!-- Efectos de daño -->
    <div id="redOverlay" class="damage-effect"></div>
    
    <!-- Mensaje de choque -->
    <div id="crashMessage">
        <h2>CRASH!</h2>
        <p>Car heavily damaged</p>
        <p>Returning to start...</p>
    </div>
    
    <!-- Botón pantalla completa -->
    <button id="fullscreenBtn">FULLSCREEN</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        // Variables globales
        let container, camera, scene, renderer, controls;
        let circuitModel = null;
        let carModel = null;
        let mixer = null;
        let clock = new THREE.Clock();
        
        // Variables de juego
        let currentSpeed = 0;
        let maxSpeed = 330;
        let acceleration = 30;
        let brakeForce = 60;
        let friction = 8;
        let steering = 0;
        let steeringSpeed = 0.03;
        
        // Controles táctiles
        let joystickActive = false;
        let joystickStartX = 0;
        let joystickStartY = 0;
        let joystickX = 0;
        let joystickY = 0;
        
        let throttleActive = false;
        let throttleValue = 0;
        let brakeActive = false;
        let brakeValue = 0;
        
        // Sistema de daño
        let carHealth = 100;
        let isCarDestroyed = false;
        
        // Sistema de tiempo
        let raceStartTime = 0;
        let currentLapStartTime = 0;
        let lapCount = 0;
        let totalLaps = 3;
        let isRacing = false;
        let bestLapTime = 0;
        
        // Cámara
        let cameraMode = 'follow'; // 'follow', 'orbit', 'hood'
        let cameraDistance = 10;
        let cameraHeight = 3;
        
        // Variables para seguimiento del circuito
        let finishLine = {
            minX: -380,
            maxX: -370,
            z: -402.5,
            width: 5
        };
        
        // FACTOR DE ESCALA DEL CIRCUITO - ¡AUMENTADO!
        const CIRCUIT_SCALE = 1; // El circuito original es muy grande, lo escalamos para que sea manejable
        const CIRCUIT_POSITION_Y = 3; // Bajamos el circuito a la altura 0
        
        // Inicialización
        init();
        
        function init() {
            container = document.getElementById('container');
            const loadingElement = document.getElementById('loading');
            
            // Crear renderizador
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setAnimationLoop(animate);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);
            
            // Crear escena
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            
            // Crear cámara
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 10000);
            camera.position.set(0, 5, 10);
            
            // Añadir luces
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 20, 10);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Cargar circuito
            const loader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://unpkg.com/three@0.165.0/examples/jsm/libs/draco/');
            loader.setDRACOLoader(dracoLoader);
            
            loadingElement.textContent = "Loading SPA Circuit...";
            
            loader.load(
                'laguna_seca.glb',
                function(gltf) {
                    circuitModel = gltf.scene;
                    
                    // ESCALAR EL CIRCUITO - ¡LO HACEMOS MÁS GRANDE!
                    circuitModel.scale.set(CIRCUIT_SCALE, CIRCUIT_SCALE, CIRCUIT_SCALE);
                    
                    // BAJAR EL CIRCUITO - Posicionarlo correctamente en Y
                    circuitModel.position.y = CIRCUIT_POSITION_Y;
                    
                    // Configurar sombras y propiedades físicas
                    circuitModel.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            child.material.needsUpdate = true;
                        }
                    });
                    
                    scene.add(circuitModel);
                    
                    // Calcular bounding box para posicionamiento
                    const boundingBox = new THREE.Box3().setFromObject(circuitModel);
                    const size = boundingBox.getSize(new THREE.Vector3());
                    const center = boundingBox.getCenter(new THREE.Vector3());
                    
                    console.log('Circuit loaded. Size:', size, 'Center:', center, 'Scale:', CIRCUIT_SCALE);
                    
                    // Crear coche simple (cubo temporal)
                    createCar();
                    
                    // Posicionar coche en la línea de salida - COORDENADAS AJUSTADAS
                    // Usamos las coordenadas del centro del circuito como referencia
                    const startPosition = new THREE.Vector3(
                        center.x - 10,  // Ajuste horizontal
                        1,               // BAJAR EL JUGADOR - altura sobre el circuito
                        center.z - 10    // Ajuste de profundidad
                    );
                    
                    carModel.position.copy(startPosition);
                    carModel.rotation.y = Math.PI / 2;
                    
                    // Posicionar cámara cerca del coche
                    camera.position.set(
                        startPosition.x - 10,
                        startPosition.y + 5,
                        startPosition.z + 10
                    );
                    
                    // Ocultar mensaje de carga
                    loadingElement.style.display = 'none';
                    
                    // Inicializar controles táctiles
                    initTouchControls();
                    
                    // Inicializar UI
                    initUI();
                    
                    console.log('✅ Game initialized successfully');
                    console.log('Car position:', carModel.position);
                    console.log('Circuit position:', circuitModel.position);
                },
                function(xhr) {
                    if (loadingElement) {
                        const percentage = Math.round((xhr.loaded / xhr.total) * 100);
                        loadingElement.textContent = `Loading SPA Circuit... ${percentage}%`;
                    }
                },
                function(error) {
                    console.error('❌ Error loading circuit:', error);
                    if (loadingElement) {
                        loadingElement.innerHTML = 'Error loading circuit:<br>' + error.message;
                        loadingElement.style.color = 'red';
                    }
                }
            );
            
            // Configurar controles de órbita (para debug)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.1;
            controls.enabled = false; // Desactivados por defecto (usamos controles de coche)
            
            // Eventos de ventana
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('keydown', onKeyDown);
            
            // Iniciar tiempo de carrera
            raceStartTime = Date.now();
            currentLapStartTime = raceStartTime;
        }
        
        function createCar() {
            // Grupo principal del coche
            carModel = new THREE.Group();
            
            // Chasis (forma de cápsula para mejor aerodinámica)
            const chassisGeometry = new THREE.CapsuleGeometry(0.5, 2, 4, 8);
            const chassisMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff0000,
                metalness: 0.8,
                roughness: 0.2
            });
            const chassis = new THREE.Mesh(chassisGeometry, chassisMaterial);
            chassis.castShadow = true;
            chassis.receiveShadow = true;
            carModel.add(chassis);
            
            // Cabina
            const cockpitGeometry = new THREE.BoxGeometry(0.9, 0.4, 0.8);
            const cockpitMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x000000,
                metalness: 0.5,
                roughness: 0.3
            });
            const cockpit = new THREE.Mesh(cockpitGeometry, cockpitMaterial);
            cockpit.position.set(0, 0.2, -0.2);
            carModel.add(cockpit);
            
            // Alerón trasero
            const rearWingGeometry = new THREE.BoxGeometry(1.5, 0.1, 0.3);
            const rearWingMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x333333,
                metalness: 0.9,
                roughness: 0.1
            });
            const rearWing = new THREE.Mesh(rearWingGeometry, rearWingMaterial);
            rearWing.position.set(0, 0.3, -0.8);
            carModel.add(rearWing);
            
            // Ruedas
            const wheelGeometry = new THREE.CylinderGeometry(0.3, 0.3, 0.2, 16);
            const wheelMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x222222,
                metalness: 0.7,
                roughness: 0.3
            });
            
            const wheelPositions = [
                { x: 0.5, y: -0.3, z: 0.5 },   // Delantera derecha
                { x: -0.5, y: -0.3, z: 0.5 },  // Delantera izquierda
                { x: 0.5, y: -0.3, z: -0.5 },  // Trasera derecha
                { x: -0.5, y: -0.3, z: -0.5 }  // Trasera izquierda
            ];
            
            wheelPositions.forEach((pos, index) => {
                const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
                wheel.position.set(pos.x, pos.y, pos.z);
                wheel.rotation.z = Math.PI / 2;
                wheel.castShadow = true;
                carModel.add(wheel);
            });
            
            scene.add(carModel);
            
            // Añadir físicas básicas
            carModel.userData = {
                velocity: new THREE.Vector3(0, 0, 0),
                acceleration: new THREE.Vector3(0, 0, 0),
                onGround: true
            };
        }
        
        function initTouchControls() {
            const joystickContainer = document.getElementById('joystickContainer');
            const joystickHandle = document.getElementById('joystickHandle');
            const throttleContainer = document.getElementById('throttleContainer');
            const brakeContainer = document.getElementById('brakeContainer');
            const throttleFill = document.getElementById('throttleFill');
            const brakeFill = document.getElementById('brakeFill');
            
            // Joystick (dirección)
            joystickContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
                const touch = e.touches[0];
                const rect = joystickContainer.getBoundingClientRect();
                joystickStartX = touch.clientX - rect.left;
                joystickStartY = touch.clientY - rect.top;
                updateJoystick(touch);
            }, { passive: false });
            
            joystickContainer.addEventListener('touchmove', (e) => {
                if (!joystickActive) return;
                e.preventDefault();
                updateJoystick(e.touches[0]);
            }, { passive: false });
            
            joystickContainer.addEventListener('touchend', (e) => {
                joystickActive = false;
                joystickX = 0;
                joystickY = 0;
                joystickHandle.style.transform = 'translate(-50%, -50%)';
            });
            
            function updateJoystick(touch) {
                const rect = joystickContainer.getBoundingClientRect();
                const currentX = touch.clientX - rect.left;
                const currentY = touch.clientY - rect.top;
                
                const dx = currentX - joystickStartX;
                const dy = currentY - joystickStartY;
                
                const maxDist = 40;
                const distance = Math.min(Math.sqrt(dx * dx + dy * dy), maxDist);
                
                if (distance > 5) {
                    const angle = Math.atan2(dy, dx);
                    joystickX = (distance / maxDist) * Math.cos(angle);
                    joystickY = (distance / maxDist) * Math.sin(angle);
                    
                    const handleX = joystickX * maxDist;
                    const handleY = joystickY * maxDist;
                    
                    joystickHandle.style.transform = `translate(calc(-50% + ${handleX}px), calc(-50% + ${handleY}px))`;
                } else {
                    joystickX = 0;
                    joystickY = 0;
                    joystickHandle.style.transform = 'translate(-50%, -50%)';
                }
            }
            
            // Acelerador
            throttleContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                throttleActive = true;
                updateThrottle(e.touches[0]);
            }, { passive: false });
            
            throttleContainer.addEventListener('touchmove', (e) => {
                if (!throttleActive) return;
                e.preventDefault();
                updateThrottle(e.touches[0]);
            }, { passive: false });
            
            throttleContainer.addEventListener('touchend', () => {
                throttleActive = false;
                throttleValue = 0;
                throttleFill.style.height = '0%';
            });
            
            function updateThrottle(touch) {
                const rect = throttleContainer.getBoundingClientRect();
                const relativeY = touch.clientY - rect.top;
                let pressure = 1 - (relativeY / rect.height);
                pressure = Math.max(0, Math.min(1, pressure));
                
                throttleValue = pressure;
                throttleFill.style.height = (pressure * 100) + '%';
            }
            
            // Freno
            brakeContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                brakeActive = true;
                updateBrake(e.touches[0]);
            }, { passive: false });
            
            brakeContainer.addEventListener('touchmove', (e) => {
                if (!brakeActive) return;
                e.preventDefault();
                updateBrake(e.touches[0]);
            }, { passive: false });
            
            brakeContainer.addEventListener('touchend', () => {
                brakeActive = false;
                brakeValue = 0;
                brakeFill.style.height = '0%';
            });
            
            function updateBrake(touch) {
                const rect = brakeContainer.getBoundingClientRect();
                const relativeY = touch.clientY - rect.top;
                let pressure = 1 - (relativeY / rect.height);
                pressure = Math.max(0, Math.min(1, pressure));
                
                brakeValue = pressure;
                brakeFill.style.height = (pressure * 100) + '%';
            }
            
            // Botones de control
            document.getElementById('resetBtn').addEventListener('click', resetToStart);
            document.getElementById('pauseBtn').addEventListener('click', togglePause);
            document.getElementById('cameraBtn').addEventListener('click', toggleCamera);
            document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        }
        
        function initUI() {
            // Inicializar actualizaciones de UI
            updateUI();
        }
        
        function updateUI() {
            // Actualizar velocidad
            const speedKmh = Math.abs(currentSpeed * 3.6);
            document.getElementById('speedValue').textContent = Math.round(speedKmh) + ' km/h';
            
            // Actualizar RPM (simulado)
            const rpm = Math.min(8000, Math.round(speedKmh * 30));
            const rpmPercent = (rpm / 8000) * 100;
            document.getElementById('rpmFill').style.width = rpmPercent + '%';
            document.getElementById('rpmValue').textContent = rpm;
            
            // Cambiar color del RPM
            if (rpmPercent < 60) {
                document.getElementById('rpmFill').style.background = '#0f0';
            } else if (rpmPercent < 85) {
                document.getElementById('rpmFill').style.background = '#ff0';
            } else {
                document.getElementById('rpmFill').style.background = '#f00';
            }
            
            // Actualizar marcha
            let gear = 'N';
            if (currentSpeed > 1) {
                if (speedKmh < 30) gear = '1';
                else if (speedKmh < 60) gear = '2';
                else if (speedKmh < 90) gear = '3';
                else if (speedKmh < 120) gear = '4';
                else if (speedKmh < 150) gear = '5';
                else gear = '6';
            } else if (currentSpeed < -1) {
                gear = 'R';
            }
            document.getElementById('gearIndicator').textContent = gear;
            
            // Actualizar daño
            const damagePercent = 100 - carHealth;
            document.getElementById('damageFill').style.width = damagePercent + '%';
            
            // Actualizar tiempo
            if (isRacing) {
                const currentTime = Date.now() - currentLapStartTime;
                document.getElementById('currentTimer').textContent = formatTime(currentTime);
            }
            
            // Actualizar contador de vueltas
            document.getElementById('lapCounter').textContent = `Lap ${lapCount}/${totalLaps}`;
        }
        
        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const milliseconds = Math.floor((ms % 1000));
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
        }
        
        function animate() {
            const delta = clock.getDelta();
            
            // Solo actualizar física si el juego no está en pausa
            if (!document.getElementById('pauseBtn').classList.contains('paused')) {
                updatePhysics(delta);
                updateCamera();
                checkCollisions();
                checkFinishLine();
                updateUI();
            }
            
            // Actualizar animaciones
            if (mixer) {
                mixer.update(delta);
            }
            
            // Renderizar escena
            renderer.render(scene, camera);
            
            // Actualizar controles
            controls.update();
        }
        
        function updatePhysics(delta) {
            if (!carModel || isCarDestroyed) return;
            
            // Aplicar aceleración
            if (throttleValue > 0) {
                currentSpeed += acceleration * throttleValue * delta;
                currentSpeed = Math.min(currentSpeed, maxSpeed);
            }
            
            // Aplicar frenado
            if (brakeValue > 0) {
                if (currentSpeed > 0) {
                    currentSpeed -= brakeForce * brakeValue * delta;
                    currentSpeed = Math.max(currentSpeed, 0);
                } else if (currentSpeed < 0) {
                    currentSpeed += brakeForce * brakeValue * delta;
                    currentSpeed = Math.min(currentSpeed, 0);
                }
            }
            
            // Fricción natural
            if (Math.abs(currentSpeed) > 0.1) {
                currentSpeed -= Math.sign(currentSpeed) * friction * delta;
            } else {
                currentSpeed = 0;
            }
            
            // Aplicar dirección
            if (Math.abs(currentSpeed) > 1 && Math.abs(joystickX) > 0.1) {
                const steeringAmount = joystickX * steeringSpeed * (currentSpeed / maxSpeed);
                carModel.rotation.y -= steeringAmount;
            }
            
            // Mover coche
            if (Math.abs(currentSpeed) > 0.1) {
                const direction = new THREE.Vector3(
                    Math.sin(carModel.rotation.y),
                    0,
                    Math.cos(carModel.rotation.y)
                );
                
                carModel.position.add(direction.multiplyScalar(currentSpeed * delta));
                
                // Mantener coche en el suelo (simulación simple)
                const groundHeight = getGroundHeight(carModel.position);
                if (groundHeight !== null) {
                    // BAJAR EL JUGADOR - mantenerlo cerca del suelo del circuito
                    const targetHeight = groundHeight + 1.0; // 1 unidad sobre el suelo
                    carModel.position.y = targetHeight;
                }
            }
            
            // Rotar ruedas (visual)
            carModel.children.forEach((child, index) => {
                if (index >= 1 && index <= 4) { // Ruedas
                    child.rotation.x += currentSpeed * delta * 5;
                }
            });
        }
        
        function getGroundHeight(position) {
            // Raycast simple para encontrar altura del terreno
            const raycaster = new THREE.Raycaster(
                new THREE.Vector3(position.x, 1000, position.z),
                new THREE.Vector3(0, -1, 0),
                0,
                2000
            );
            
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                return intersects[0].point.y;
            }
            
            return null;
        }
        
        function updateCamera() {
            if (!carModel) return;
            
            switch (cameraMode) {
                case 'follow':
                    // Cámara siguiendo desde atrás
                    const cameraDistance = 15;
                    const cameraHeight = 5;
                    
                    const targetPosition = new THREE.Vector3(
                        carModel.position.x - Math.sin(carModel.rotation.y) * cameraDistance,
                        carModel.position.y + cameraHeight,
                        carModel.position.z - Math.cos(carModel.rotation.y) * cameraDistance
                    );
                    
                    camera.position.lerp(targetPosition, 0.1);
                    camera.lookAt(carModel.position.x, carModel.position.y + 1, carModel.position.z);
                    break;
                    
                case 'hood':
                    // Vista desde el capó
                    camera.position.copy(carModel.position);
                    camera.position.y += 1.2;
                    camera.position.z += Math.cos(carModel.rotation.y) * 1;
                    camera.position.x += Math.sin(carModel.rotation.y) * 1;
                    camera.rotation.copy(carModel.rotation);
                    break;
                    
                case 'orbit':
                    // Control de órbita (para debug)
                    controls.target.copy(carModel.position);
                    break;
            }
        }
        
        function checkCollisions() {
            if (!carModel || !circuitModel || isCarDestroyed) return;
            
            // Raycast simple para detección frontal
            const forward = new THREE.Vector3(
                Math.sin(carModel.rotation.y),
                0,
                Math.cos(carModel.rotation.y)
            );
            
            const raycaster = new THREE.Raycaster(
                carModel.position.clone().add(new THREE.Vector3(0, 0.5, 0)),
                forward,
                0,
                5
            );
            
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0 && intersects[0].distance < 3) {
                // Colisión detectada
                applyDamage(Math.abs(currentSpeed) * 10);
                
                // Rebote
                currentSpeed = -currentSpeed * 0.5;
            }
        }
        
        function applyDamage(amount) {
            if (isCarDestroyed) return;
            
            carHealth = Math.max(0, carHealth - amount);
            
            // Efecto visual
            document.getElementById('redOverlay').style.opacity = '0.3';
            setTimeout(() => {
                document.getElementById('redOverlay').style.opacity = '0';
            }, 200);
            
            // Verificar si el coche está destruido
            if (carHealth <= 0) {
                destroyCar();
            }
        }
        
        function destroyCar() {
            isCarDestroyed = true;
            
            // Mostrar mensaje de choque
            document.getElementById('crashMessage').style.display = 'block';
            
            // Deshabilitar controles temporalmente
            setTimeout(() => {
                resetToStart();
                document.getElementById('crashMessage').style.display = 'none';
                isCarDestroyed = false;
                carHealth = 100;
            }, 3000);
        }
        
        function checkFinishLine() {
            if (!carModel) return;
            
            const pos = carModel.position;
            const insideX = (pos.x >= finishLine.minX && pos.x <= finishLine.maxX);
            
            if (insideX && Math.abs(pos.z - finishLine.z) < finishLine.width) {
                if (!isRacing) {
                    // Iniciar carrera
                    isRacing = true;
                    lapCount = 1;
                    currentLapStartTime = Date.now();
                } else {
                    // Completar vuelta
                    lapCount++;
                    currentLapStartTime = Date.now();
                    
                    if (lapCount > totalLaps) {
                        isRacing = false;
                        alert(`Race completed! Best lap: ${formatTime(bestLapTime)}`);
                    }
                }
            }
        }
        
        function resetToStart() {
            if (carModel && circuitModel) {
                // Obtener el centro del circuito
                const boundingBox = new THREE.Box3().setFromObject(circuitModel);
                const center = boundingBox.getCenter(new THREE.Vector3());
                
                // Posicionar el coche cerca del centro del circuito
                const startPosition = new THREE.Vector3(
                    center.x - 10,
                    1, // BAJAR EL JUGADOR - altura sobre el circuito
                    center.z - 10
                );
                
                carModel.position.copy(startPosition);
                carModel.rotation.y = Math.PI / 2;
                currentSpeed = 0;
                carHealth = 100;
                isCarDestroyed = false;
                lapCount = 0;
                isRacing = false;
            }
        }
        
        function togglePause() {
            const pauseBtn = document.getElementById('pauseBtn');
            pauseBtn.classList.toggle('paused');
            
            if (pauseBtn.classList.contains('paused')) {
                pauseBtn.textContent = '▶️';
                clock.stop();
            } else {
                pauseBtn.textContent = '⏸️';
                clock.start();
            }
        }
        
        function toggleCamera() {
            const modes = ['follow', 'hood', 'orbit'];
            const currentIndex = modes.indexOf(cameraMode);
            cameraMode = modes[(currentIndex + 1) % modes.length];
            
            // Activar/desactivar controles de órbita
            controls.enabled = (cameraMode === 'orbit');
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function onKeyDown(event) {
            // Teclas para debug/desarrollo
            switch(event.key) {
                case 'r':
                case 'R':
                    resetToStart();
                    break;
                case 'c':
                case 'C':
                    toggleCamera();
                    break;
                case ' ':
                    togglePause();
                    break;
            }
        }
    </script>
</body>
</html>
